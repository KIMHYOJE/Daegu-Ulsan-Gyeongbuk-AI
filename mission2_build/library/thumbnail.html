<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; padding: 12px; font-family: 'Noto Sans KR', sans-serif; }
  #thumb { width: 608px; height: 336px; position: relative; overflow: hidden;
    background: linear-gradient(135deg, #1e1b4b 0%, #312e81 55%, #4338ca 100%); color: #fff; }
  .glow { position: absolute; right: -80px; top: -90px; width: 320px; height: 320px; border-radius: 50%;
    background: radial-gradient(circle, rgba(129,140,248,.45), rgba(129,140,248,0) 70%); }
  .left { position: absolute; left: 32px; top: 30px; width: 300px; }
  .tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .04em; padding: 4px 9px; border-radius: 99px;
    background: rgba(255,255,255,.14); color: #c7d2fe; }
  h1 { margin-top: 14px; font-size: 29px; line-height: 1.22; font-weight: 900; letter-spacing: -.02em; }
  h1 em { font-style: normal; color: #a5b4fc; }
  .sub { margin-top: 12px; font-size: 13px; line-height: 1.55; color: #e0e7ff; }
  .flow { position: absolute; left: 32px; bottom: 26px; display: flex; align-items: center; gap: 5px; }
  .flow span { font-size: 11px; font-weight: 700; padding: 5px 8px; border-radius: 6px; background: rgba(255,255,255,.12); color: #eef2ff; }
  .flow i { font-style: normal; color: #818cf8; font-size: 11px; }
  .team { position: absolute; right: 22px; bottom: 26px; font-size: 11px; color: #a5b4fc; font-weight: 500; }

  .doc { position: absolute; right: 30px; top: 30px; width: 214px; height: 236px; background: #fff; border-radius: 12px;
    box-shadow: 0 18px 40px rgba(15,10,60,.45); padding: 16px 16px; color: #1f2937; }
  .doc .t { font-size: 11px; font-weight: 700; color: #312e81; }
  .row { display: flex; align-items: center; justify-content: space-between; margin-top: 9px; font-size: 10px; color: #6b7280; }
  .v { font-family: ui-monospace, Consolas, monospace; font-size: 10.5px; color: #111827; font-weight: 700; }
  .v.hit { background: #fee2e2; color: #b91c1c; padding: 1px 4px; border-radius: 3px; }
  .v.mask { color: #9ca3af; }
  .bar { height: 7px; border-radius: 4px; background: #e5e7eb; margin-top: 9px; }
  .badges { margin-top: 13px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .b { font-size: 10px; font-weight: 700; padding: 6px 6px; border-radius: 6px; text-align: center; line-height: 1.3; }
  .b small { display: block; font-weight: 500; font-size: 9px; opacity: .85; }
  .hi { background: #fee2e2; color: #b91c1c; outline: 2px solid #ef4444; }
  .mid { background: #ffedd5; color: #c2410c; }
  .low { background: #dcfce7; color: #15803d; }
  .rev { background: #e0e7ff; color: #3730a3; }
</style></head>
<body>
<div id="thumb">
  <div class="glow"></div>
  <div class="left">
    <span class="tag">IM뱅크 지정주제 · Upstage Studio</span>
    <h1>금융 서류 민감정보<br><em>위험도 자동 판정</em></h1>
    <p class="sub">외부 발송 전, 가려지지 않은 주민번호·계좌·<br>소득정보를 서식별로 찾아 4단계로 나누고<br>담당자가 할 일까지 알려 줍니다.</p>
  </div>
  <div class="doc">
    <div class="t">근로소득 원천징수영수증</div>
    <div class="row">주민등록번호 <span class="v hit">900101-1000017</span></div>
    <div class="row">휴대전화 <span class="v mask">010-****-2847</span></div>
    <div class="row">급여 총액 <span class="v hit">54,000,000</span></div>
    <div class="bar" style="width:80%"></div>
    <div class="badges">
      <div class="b hi">고위험<small>발송 차단</small></div>
      <div class="b mid">중위험<small>마스킹 요청</small></div>
      <div class="b low">저위험<small>발송 승인</small></div>
      <div class="b rev">검토 필요<small>담당자 확인</small></div>
    </div>
  </div>
  <div class="flow"><span>Parse</span><i>›</i><span>Classify</span><i>›</i><span>Extract</span><i>›</i><span>Validate</span><i>›</i><span>Instruct</span></div>
  <div class="team">요미의 코딩</div>
</div>
</body></html>
